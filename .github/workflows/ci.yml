name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑测试
        # 测试全部走本地夹具与符号计算，不调任何外部 API，因此不需要配 key。
        # 缓存目录留在默认位置即可：CI 是干净环境，每次都是冷启动。
        run: pytest -q

      - name: 核对资产来源
        # --strict：除"新增图片没登记""运行时产物没被 ignore"外，连"发布权未核实"
        # （status=pending）也算失败。现在 6 项已确认可公开，清单里没有 pending；
        # 以后有人再往仓库里放实拍图却忘了核发布权，这里会红，而不是安静地合进去。
        run: python tools/check_assets.py --strict
