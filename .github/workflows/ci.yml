name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑测试
        # 测试全部走本地夹具与符号计算，不调任何外部 API，因此不需要配 key。
        # 缓存目录留在默认位置即可：CI 是干净环境，每次都是冷启动。
        run: pytest -q

      - name: 核对资产来源
        # 只拦"新增图片没登记"和"运行时产物没被 ignore"这两类硬错误。
        # 授权待核实的项（status=pending）只打印警告：那是要人来答的问题，
        # 让 CI 红着不会让谁更快回答，只会让人习惯性忽略红叉。
        run: python tools/check_assets.py
